<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#00704a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>台中西屯｜7-11 BEAMS DESIGN</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --ink: #14201a;
      --muted: #5a6b62;
      --line: #dde5e0;
      --accent: #00704a;
      --accent-2: #0b3d2e;
      --soft: #e7f4ee;
      --warn: #c45c26;
      --panel: #ffffff;
      --shadow: 0 10px 30px rgba(11, 61, 46, 0.16);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --sheet-peek: 42vh;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: "Avenir Next", "Noto Sans TC", "PingFang TC", "Helvetica Neue", sans-serif;
      color: var(--ink);
      background: #dfe8e2;
      overflow: hidden;
    }
    #app {
      height: 100%;
      height: 100dvh;
      display: grid;
      grid-template-rows: auto 1fr;
    }
    header {
      z-index: 1000;
      padding: calc(10px + var(--safe-top)) 14px 10px;
      background: linear-gradient(120deg, #0b3d2e, #00704a 60%, #1f8f5f);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    header h1 {
      margin: 0;
      font-size: 1.02rem;
      line-height: 1.25;
      font-weight: 700;
    }
    header .sub {
      margin: 2px 0 0;
      font-size: 0.72rem;
      opacity: 0.88;
    }
    .chip-row {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }
    .chip {
      appearance: none;
      border: 1px solid rgba(255,255,255,0.35);
      background: rgba(255,255,255,0.14);
      color: #fff;
      border-radius: 999px;
      padding: 8px 11px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .chip:active { transform: scale(0.97); }
    .stage {
      position: relative;
      min-height: 0;
    }
    #map {
      position: absolute;
      inset: 0;
      background: #cfdcd4;
    }
    .fab {
      position: absolute;
      right: 14px;
      bottom: calc(var(--sheet-peek) + 14px + var(--safe-bottom));
      z-index: 900;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 0;
      background: #fff;
      color: var(--accent);
      box-shadow: var(--shadow);
      font-size: 1.25rem;
      cursor: pointer;
      display: grid;
      place-items: center;
    }
    .sheet {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      z-index: 950;
      height: var(--sheet-peek);
      max-height: calc(100% - 48px);
      background: var(--panel);
      border-radius: 18px 18px 0 0;
      box-shadow: 0 -8px 28px rgba(0,0,0,0.12);
      display: flex;
      flex-direction: column;
      transition: height 0.22s ease;
      padding-bottom: var(--safe-bottom);
    }
    .sheet.expanded { height: min(86vh, 100%); }
    .grab {
      flex: 0 0 auto;
      padding: 10px 14px 6px;
      text-align: center;
      cursor: pointer;
      user-select: none;
    }
    .grab::before {
      content: "";
      display: block;
      width: 42px;
      height: 4px;
      margin: 0 auto 8px;
      border-radius: 999px;
      background: #c9d4ce;
    }
    .grab .title {
      font-size: 0.92rem;
      font-weight: 700;
    }
    .grab .meta {
      margin-top: 2px;
      font-size: 0.75rem;
      color: var(--muted);
    }
    .grab .meta strong { color: var(--accent); }
    .filters {
      display: grid;
      grid-template-columns: 1fr 1.3fr;
      gap: 8px;
      padding: 0 12px 10px;
      flex: 0 0 auto;
    }
    .filters select, .filters input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 11px 12px;
      font-size: 16px; /* avoid iOS zoom */
      background: #f7faf8;
      color: var(--ink);
    }
    #list {
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      padding: 0 10px 12px;
      flex: 1;
      min-height: 0;
    }
    .card {
      width: 100%;
      text-align: left;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 8px;
      cursor: pointer;
      font: inherit;
      color: inherit;
    }
    .card.active {
      border-color: #8ec9ae;
      background: var(--soft);
    }
    .card-top {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: flex-start;
    }
    .card h3 {
      margin: 0;
      font-size: 1rem;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }
    .badge {
      font-size: 0.68rem;
      background: var(--warn);
      color: #fff;
      padding: 2px 7px;
      border-radius: 999px;
      font-weight: 700;
    }
    .dist {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--accent);
      white-space: nowrap;
    }
    .addr, .tel {
      margin: 4px 0 0;
      font-size: 0.82rem;
      color: var(--muted);
      line-height: 1.4;
    }
    .nav-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
    }
    .nav-row a {
      display: block;
      text-align: center;
      text-decoration: none;
      font-size: 0.82rem;
      font-weight: 700;
      padding: 10px 8px;
      border-radius: 11px;
    }
    .nav-row a.g {
      background: var(--accent);
      color: #fff;
    }
    .nav-row a.a {
      background: #eef2f0;
      color: var(--accent-2);
    }
    .leaflet-popup-content {
      font-size: 0.88rem;
      line-height: 1.45;
      margin: 10px 12px;
    }
    .leaflet-popup-content a {
      color: var(--accent);
      font-weight: 700;
      text-decoration: none;
    }
    .user-dot {
      background: #4285f4;
      border: 3px solid #fff;
      border-radius: 50%;
      box-shadow: 0 0 0 6px rgba(66,133,244,0.25);
    }
    .empty {
      text-align: center;
      color: var(--muted);
      padding: 28px 12px;
      font-size: 0.9rem;
    }
    @media (min-width: 900px) {
      #app {
        grid-template-columns: 400px 1fr;
        grid-template-rows: auto 1fr;
      }
      header { grid-column: 1 / -1; }
      .stage {
        display: contents;
      }
      #map {
        position: relative;
        inset: auto;
        height: 100%;
      }
      .sheet {
        position: relative;
        height: auto !important;
        max-height: none;
        border-radius: 0;
        box-shadow: none;
        border-right: 1px solid var(--line);
        grid-row: 2;
        grid-column: 1;
      }
      .fab {
        position: fixed;
        right: 22px;
        bottom: calc(22px + var(--safe-bottom));
      }
      .grab::before { display: none; }
      .filters { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <div>
        <h1>7-11 × BEAMS DESIGN</h1>
        <div class="sub">台中門市・預設西屯｜資料來源 emap.pcsc.com.tw</div>
      </div>
      <div class="chip-row">
        <button type="button" class="chip" id="btnLocate">附近</button>
        <button type="button" class="chip" id="btnExpand">列表</button>
        <a class="chip" href="./import-google-maps.html" style="text-decoration:none;display:inline-block">匯入Google</a>
      </div>
    </header>
    <div class="stage">
      <div id="map"></div>
      <button type="button" class="fab" id="fabLocate" title="定位">◎</button>
      <section class="sheet" id="sheet">
        <div class="grab" id="grab">
          <div class="title">門市列表</div>
          <div class="meta">顯示 <strong id="count">0</strong> 家・點店名飛地圖・可開 Google／Apple 地圖</div>
        </div>
        <div class="filters">
          <select id="district" aria-label="行政區"></select>
          <input id="q" type="search" placeholder="搜店名／地址／店號" enterkeyhint="search" />
        </div>
        <div id="list"></div>
      </section>
    </div>
  </div>

      return Math.sqrt(dlat * dlat + dlng * dlng);

    function fmtKm(km) {

    function filtered() {
      const d = districtSel.value;
      const q = document.getElementById('q').value.trim().toLowerCase();
      let list = STORES.filter(s => {

        userMarker = L.marker([userPos.lat, userPos.lng], {
          icon: L.divIcon({ className: '', html: '<div class="user-dot" style="width:14px;height:14px"></div>', iconSize: [14, 14], iconAnchor: [7, 7] })
        }).addTo(map).bindPopup('你在這裡');
        map.setView([userPos.lat, userPos.lng], 15);
        activeId = null;
        render();
        const nearest = filtered()[0];
        if (nearest) selectStore(nearest.id, true);
      }, () => alert('無法取得定位，請在設定允許此網站使用定位'), {
        enableHighAccuracy: true, timeout: 12000
      });
    }

    document.getElementById('btnLocate').addEventListener('click', locate);
    document.getElementById('fabLocate').addEventListener('click', locate);
    document.getElementById('btnExpand').addEventListener('click', () => {
      document.getElementById('sheet').classList.toggle('expanded');
      setTimeout(() => map.invalidateSize(), 220);
    });
    document.getElementById('grab').addEventListener('click', () => {
      document.getElementById('sheet').classList.toggle('expanded');
      setTimeout(() => map.invalidateSize(), 220);
    });
    districtSel.addEventListener('change', () => { activeId = null; render(); });
    document.getElementById('q').addEventListener('input', () => { activeId = null; render(); });
    window.addEventListener('resize', () => map.invalidateSize());
    render();
  </script>
</body>
</html>
